<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; frame-src 'self' https://rainendtoend.streamlit.app;">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Order-K Delaunay Triangulation Research</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/delaunay.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script type="module" src="assets/js/delaunay.entry.js"></script>
</head>
<body>
    <canvas id="three-background"></canvas>

    <a href="index.html" class="back-button" id="delaunay-back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span id="delaunay-back-label"></span>
    </a>

    <div class="container">
        <div class="header">
            <h1 class="project-title" id="delaunay-title"></h1>
            <p class="research-authors" id="delaunay-authors"></p>
            <p class="project-subtitle" id="delaunay-subtitle"></p>
            <div class="tech-tags" id="delaunay-tech-tags"></div>
        </div>

        <div class="content-grid">
            <div class="glass-panel info-panel">
                <div class="info-section">
                    <h2 class="info-title" id="delaunay-demo-title"></h2>
                    <div id="delaunay-demo-texts"></div>
                </div>

                <div class="info-section">
                    <h2 class="info-title">Statistics</h2>
                    <div class="stat-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="pointCount">0</div>
                            <div class="stat-label">Points</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="triangleCount">0</div>
                            <div class="stat-label">Triangles</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="minAngle">0°</div>
                            <div class="stat-label">Min Angle</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="avgAngle">0°</div>
                            <div class="stat-label">Avg Angle</div>
                        </div>
                    </div>
                </div>

                <div class="info-section">
                    <h2 class="info-title">Controls</h2>
                    <div class="control-buttons">
                        <button class="control-btn" data-action="load-example"><span>Load Example</span></button>
                        <button class="control-btn" data-add-count="10"><span>Add 10 Random</span></button>
                        <button class="control-btn" data-add-count="50"><span>Add 50 Random</span></button>
                        <button class="control-btn" data-action="clear"><span>Clear All</span></button>
                        <button class="control-btn" id="toggleVoronoi" data-action="toggle-voronoi"><span>Show Voronoi</span></button>
                    </div>
                </div>
            </div>

            <div class="glass-panel">
                <svg id="delaunay-canvas"></svg>
            </div>
        </div>

        <div class="section-divider"></div>

        <!-- Research Content -->
        <div class="research-section">
            <div class="glass-panel research-content">
                <h2 class="research-title" id="delaunay-research-title"></h2>
                <div id="delaunay-research-body"></div>
            </div>
        </div>

        <!-- PDF VIEWER SECTION -->
        <div class="section-divider"></div>

        <div class="glass-panel pdf-section">
            <h2 class="pdf-header" id="delaunay-pdf-title"></h2>

            <p class="pdf-text" id="delaunay-pdf-description"></p>

            <div style="text-align:center;">
                <a
                    href="./docs/delaunay-milestone.pdf"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="pdf-open-btn"
                    id="delaunay-pdf-link"
                >
                    <span id="delaunay-pdf-button"></span>
                </a>
            </div>

            <div class="pdf-frame-wrapper">
                <iframe
                    class="pdf-frame"
                    src="./docs/delaunay-milestone.pdf"
                    id="delaunay-pdf-frame"
                    loading="lazy"
                    referrerpolicy="no-referrer"
                ></iframe>
            </div>
        </div>
    </div>

    </body>
</html>
