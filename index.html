<!DOCTYPE html>

<head>

        content="Software engineer and researcher blending formal mathematics with practical engineering to ship ML systems, computational geometry tooling, and polished product experiences.">

        content="Software engineer and researcher blending formal mathematics with practical engineering to ship ML systems, computational geometry tooling, and polished product experiences.">
    <meta name="twitter:image" content="https://armandoalbornoz.github.io/portafolio/og-image.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload"
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"

    <link rel="stylesheet"

    <link rel="preload" href="assets/css/base.css" as="style">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="preload" href="assets/css/portfolio.css" as="style">
    <link rel="stylesheet" href="assets/css/portfolio.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="canonical" href="https://armandoalbornoz.github.io/portafolio/">
    <script type="module" src="assets/js/portfolio.entry.js"></script>
</head>

<body data-visual-mode="static">
    <div id="canvas-container"></div>

    <div class="content-wrapper">
        <nav id="site-nav" aria-label="Primary">
            <a href="#home" class="logo" aria-label="Armando Albornoz home">AA</a>
            <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-panel"
                aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-panel" id="nav-panel">
                <ul class="nav-menu">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#projects">Projects</a></li>
                    <li><a href="#experience">Experience</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
                <div class="nav-actions" id="nav-actions"></div>
            </div>
        </nav>

        <main class="page-shell">
            <section class="hero hero--simple" id="home">
                <div class="hero-copy hero-copy--centered">
                    <div class="hero-kicker-row hero-kicker-row--centered">
                        <span class="hero-kicker" id="hero-kicker"></span>
                    </div>
                    <h1 class="hero-title" id="hero-title"></h1>
                    <p class="hero-subtitle" id="hero-subtitle"></p>
                    <p class="hero-summary" id="hero-summary"></p>
                    <div class="hero-roles hero-roles--centered" id="hero-roles"></div>
                    <div class="hero-actions hero-actions--centered">
                        <a class="hero-action hero-action--primary" id="hero-primary-cta"></a>
                        <a class="hero-action hero-action--secondary" id="hero-secondary-cta"></a>
                    </div>
                </div>
            </section>

            <section class="overview-section scroll-stage scroll-stage--panel">
                <div class="overview-grid" id="overview-grid" data-scroll-surface></div>
            </section>

            <section class="assistant-section scroll-stage scroll-stage--compact" id="assistant">
                <div class="assistant-inline" data-scroll-surface>
                    <div class="assistant-inline__header">
                        <p class="assistant-inline__eyebrow" id="assistant-badge"></p>
                        <h2 class="assistant-inline__title" id="assistant-title"></h2>
                        <p class="assistant-inline__description" id="assistant-description"></p>
                    </div>
                    <div class="assistant-inline__prompts" id="assistant-widget-prompts"></div>
                    <div class="assistant-inline__shell">
                        <div class="assistant-inline__messages" id="assistant-messages"></div>
                        <form class="assistant-inline__form" id="assistant-form">
                            <label class="sr-only" for="assistant-input">Ask a question about Armando</label>
                            <textarea id="assistant-input" class="assistant-inline__input"
                                placeholder="What would you like to know?" rows="1"></textarea>
                            <button type="submit" class="assistant-inline__send" aria-label="Send message">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M12 19V5"></path>
                                    <path d="M5 12l7-7 7 7"></path>
                                </svg>
                            </button>
                        </form>
                    </div>
                    <p class="assistant-inline__disclaimer" id="assistant-disclaimer"></p>
                </div>
            </section>

            <section class="about-section scroll-stage scroll-stage--panel" id="about">
                <div class="section-shell" data-scroll-surface>
                    <div class="about-layout">
                        <div class="about-content">
                            <div class="section-intro about-intro">
                                <span class="section-label" id="about-label"></span>
                                <h2 class="section-title about-text" id="about-heading"></h2>
                                <p class="section-summary" id="about-summary"></p>
                            </div>
                            <div class="about-copy" id="about-descriptions"></div>
                        </div>
                        <div class="about-rail">
                            <div class="education-grid" id="education-grid"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="projects-section scroll-stage" id="projects">
                <div class="section-shell" data-scroll-surface>
                    <div class="section-intro section-intro--row">
                        <div>
                            <span class="section-label" id="projects-label"></span>
                            <h2 class="section-title">Work</h2>
                            <p class="section-summary" id="projects-summary"></p>
                        </div>
                    </div>
                    <div class="projects-grid" id="projects-grid"></div>
                </div>
            </section>

            <section class="experience-section scroll-stage" id="experience">
                <div class="section-shell" data-scroll-surface>
                    <div class="section-intro section-intro--row">
                        <div>
                            <span class="section-label" id="experience-label"></span>
                            <h2 class="section-title">Research and Experience</h2>
                            <p class="section-summary" id="experience-summary"></p>
                        </div>
                    </div>
                    <div class="experience-grid" id="experience-grid"></div>
                </div>
            </section>

            <section class="contact-section scroll-stage scroll-stage--compact" id="contact">
                <div class="section-shell contact-shell contact-shell--simple" data-scroll-surface>
                    <div class="contact-copy">
                        <h2 class="contact-title" id="contact-title"></h2>
                        <p class="contact-description" id="contact-description"></p>
                        <div class="contact-links" id="contact-links"></div>
                    </div>
                </div>
            </section>
        </main>

        <div id="coming-soon-modal" class="modal">
            <div class="modal-content">
                <button class="modal-close" type="button" data-modal-close>&times;</button>
                <div class="modal-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </div>
                <h2 class="modal-title" id="modal-title"></h2>
                <p class="modal-description" id="modal-description"></p>
                <a href="#contact" class="modal-btn" data-modal-close id="modal-button"></a>
            </div>
        </div>

        <footer class="footer">
            <p id="footer-text"></p>
        </footer>
    </div>
</body>

</html>
